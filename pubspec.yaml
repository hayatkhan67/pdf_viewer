name: easy_pdf_viewer_plus
description: A flutter plugin for handling PDF files. Works on both Android & iOS. An upgraded and maintained fork of easy_pdf_viewer.
version: 2.0.1
homepage: https://github.com/hayatkhan67/pdf_viewer
repository: https://github.com/hayatkhan67/pdf_viewer

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_cache_manager: ^3.4.1
  numberpicker: ^2.1.2
  path_provider: ">=2.1.5 <3.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  # This section identifies this Flutter project as a plugin project.
  # The 'pluginClass' and Android 'package' identifiers should not ordinarily
  # be modified. They are used by the tooling to maintain consistency when
  # adding or updating assets for this project.
  plugin:
    platforms:
      android:
        package: dev.kaichi.easy_pdf_viewer_plus
        pluginClass: EasyPdfViewerPlugin
      ios:
        pluginClass: EasyPdfViewerPlugin
